<html lang="my">
<head>

    <script src="course_files.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f2f6fc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f2f6fc, #e8f0fe);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px 24px 28px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 20, 50, 0.15), 0 4px 16px rgba(0, 0, 0, 0.05);
            max-width: 460px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
            transition: all 0.2s ease;
            text-align: center;
            max-height: 95vh;
            overflow-y: auto;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1c2e4a;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 16px;
            color: #5b6f87;
            font-weight: 400;
            margin-bottom: 28px;
            letter-spacing: 0.3px;
        }

        input[type="text"] {
            padding: 16px 20px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 6px;
            border: none;
            border-radius: 16px;
            background: rgba(245, 249, 255, 0.9);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.02);
            margin: 8px 0 4px;
            width: 100%;
            text-align: center;
            color: #1a2b3e;
            transition: box-shadow 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02), 0 0 0 2px #007aff;
            background: #ffffff;
        }
        input[type="text"]:disabled {
            background: #e9ecf0;
            color: #8e9aab;
            opacity: 0.8;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 18px;
            background: #007aff;
            color: white;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100%;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
            position: relative;
            -webkit-user-select: none;
            user-select: none;
        }
        button:active:not(:disabled) {
            transform: scale(0.97);
            opacity: 0.8;
        }
        button:disabled {
            background: #b0bac9;
            box-shadow: none;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .activate-button {
            background: linear-gradient(135deg, #f5a623, #f7b731);
            box-shadow: 0 4px 16px rgba(245, 166, 35, 0.25);
            color: #1c2e4a;
        }
        .activate-button:active:not(:disabled) {
            background: #e09c1e;
        }

        .free-button {
            background: #34c759;
            box-shadow: 0 4px 14px rgba(52, 199, 89, 0.25);
        }
        .free-button:active:not(:disabled) {
            background: #2db84e;
        }

        .buy-button {
            background: #ff3b30;
            box-shadow: 0 4px 14px rgba(255, 59, 48, 0.25);
        }
        .buy-button:active:not(:disabled) {
            background: #e6352b;
        }

        /* Download Section - Clean, no file list */
        .download-section {
            margin-top: 20px;
            padding: 16px;
            background: rgba(0, 122, 255, 0.06);
            border-radius: 20px;
            border: 1px solid rgba(0, 122, 255, 0.1);
        }

        .download-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .download-title {
            font-size: 14px;
            font-weight: 600;
            color: #1c2e4a;
        }

        .download-status {
            font-size: 12px;
            color: #5b6f87;
        }
        .download-status.downloading { color: #007aff; }
        .download-status.done { color: #34c759; }
        .download-status.paused { color: #f5a623; }
        .download-status.error { color: #ff3b30; }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #007aff, #34c759);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .download-details {
            display: flex;
            justify-content: center;
            font-size: 11px;
            color: #8e9aab;
            margin-top: 6px;
            gap: 16px;
        }

        .download-btn {
            background: #007aff;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            width: 100%;
        }
        .download-btn:active {
            transform: scale(0.95);
        }
        .download-btn:disabled {
            background: #b0bac9;
            cursor: not-allowed;
        }

        /* HIDE FILE LIST - Completely hidden on all platforms */
        .file-list {
            display: none !important;
        }

        .offline-badge {
            display: none;
            background: #ff6b6b;
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            box-shadow: 0 2px 8px rgba(255, 107, 107, 0.3);
            letter-spacing: 0.5px;
        }
        .offline-badge.show {
            display: block;
        }

        .close-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.04);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #1c2e4a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            z-index: 999;
            transition: background 0.2s;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03);
            border: 1px solid rgba(255,255,255,0.2);
            line-height: 1;
        }
        .close-btn:active {
            background: rgba(0, 0, 0, 0.1);
            transform: scale(0.92);
        }

        .spinner-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 20;
        }
        .spinner-overlay.active {
            display: flex;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(0, 122, 255, 0.15);
            border-top: 4px solid #007aff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 14px;
            font-size: 15px;
            color: #1c2e4a;
            font-weight: 500;
        }
        .loading-dots::after {
            content: '';
            animation: dots 1.4s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        #message {
            margin-top: 18px;
            font-size: 15px;
            min-height: 26px;
            font-weight: 500;
            padding: 0 6px;
        }
        .error { color: #ff3b30; }
        .success { color: #34c759; }
        .info { color: #007aff; }
        .warning { color: #f5a623; }

        .timer {
            font-size: 14px;
            color: #5b6f87;
            margin-top: 10px;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.02);
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
        }

        .trial-used {
            background: rgba(255, 59, 48, 0.08);
            padding: 12px 16px;
            border-radius: 20px;
            margin-top: 16px;
            border: 1px solid rgba(255, 59, 48, 0.15);
            font-size: 14px;
            color: #c0392b;
            font-weight: 500;
        }

        .security-badge {
            font-size: 12px;
            color: #8e9aab;
            margin-top: 24px;
            opacity: 0.7;
            letter-spacing: 0.3px;
        }

        .cache-info {
            font-size: 11px;
            color: #8e9aab;
            margin-top: 4px;
            opacity: 0.6;
        }

        .file-count-badge {
            display: inline-block;
            background: rgba(0, 122, 255, 0.1);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #007aff;
            font-weight: 600;
            margin-left: 8px;
        }

        .auto-download-badge {
            display: inline-block;
            background: rgba(52, 199, 89, 0.15);
            color: #34c759;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 6px;
            animation: pulse 2s infinite;
        }
        .auto-download-badge.paused {
            background: rgba(245, 166, 35, 0.15);
            color: #f5a623;
            animation: none;
        }
        .auto-download-badge.error {
            background: rgba(255, 59, 48, 0.15);
            color: #ff3b30;
            animation: none;
        }

        .ios-persist-badge {
            display: inline-block;
            background: rgba(0, 122, 255, 0.1);
            color: #007aff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 6px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 420px) {
            .container {
                padding: 24px 18px 22px;
                border-radius: 32px;
            }
            h1 { font-size: 28px; }
            input[type="text"] { font-size: 20px; padding: 14px 16px; }
            button { font-size: 16px; padding: 15px 16px; }
        }

        @supports (padding: max(0px)) {
            .container {
                padding-left: max(24px, env(safe-area-inset-left));
                padding-right: max(24px, env(safe-area-inset-right));
            }
        }
    </style>

<body>

    <div class="offline-badge" id="offlineBadge">📡 Offline Mode</div>
    <div class="close-btn" id="closeButton">✕</div>

    <div class="container" id="appContainer">
        <div class="spinner-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-text">Connecting<span class="loading-dots"></span></div>
        </div>

        <h1>Pre-KG English</h1>
        <div class="subtitle">Fun Learning for Kids!</div>

        <input type="text" id="secretCode" maxlength="6" placeholder="Enter 6-digit code" autofocus inputmode="numeric">

        <div class="btn-group">
            <button class="activate-button" id="activateBtn">🔑 Activate</button>
            <button class="free-button" id="trialBtn">📝 Get 3 Days Free Trial Code</button>
            <button class="buy-button" id="buyBtn">🛒 Buy Code</button>
        </div>

        <!-- Download Section - Clean, no file list -->
        <div class="download-section" id="downloadSection">
            <div class="download-header">
                <span class="download-title">
                    📥 Course Content 
                    <span class="file-count-badge" id="fileCountBadge">0 files</span>
                    <span class="auto-download-badge" id="autoDownloadBadge" style="display:none;">⏳ Auto</span>
                    <span class="ios-persist-badge" id="iosPersistBadge" style="display:none;">🍎 iOS</span>
                </span>
                <span class="download-status" id="downloadStatus">Not Downloaded</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="download-details">
                <span id="downloadedSize">0 MB</span>
                <span id="totalSize">/ 0 MB</span>
                <span id="downloadSpeed">0 MB/s</span>
            </div>
            <button class="download-btn" id="downloadBtn">⬇️ Download Course</button>
            <!-- FILE LIST COMPLETELY HIDDEN - No file names shown -->
            <div class="file-list" id="fileList" style="display:none !important;"></div>
            <div class="cache-info" id="cacheInfo">📦 Checking cache...</div>
        </div>

        <p id="message"></p>
        <div id="timerDisplay" class="timer"></div>
        <div id="trialStatus" class="trial-used" style="display:none;"></div>
        <div class="security-badge">🔒 Secure System</div>
    </div>

    <script>
        // ============================================================
        // UNIVERSAL PERSISTENT STORAGE - All Platforms
        // iOS: Cookie Backup | Android/Windows: localStorage
        // ============================================================
        (function() {
            // Detect platform
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const isAndroid = /Android/.test(navigator.userAgent);
            const isWindows = /Windows/.test(navigator.userAgent);
            
            console.log('🖥️ Platform:', isIOS ? 'iOS' : isAndroid ? 'Android' : isWindows ? 'Windows' : 'macOS/Other');
            
            // ============================================================
            // COOKIE HELPERS (For iOS persistence)
            // ============================================================
            function setCookie(name, value, days) {
                try {
                    const expires = new Date(Date.now() + days * 86400000).toUTCString();
                    document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/; SameSite=Lax';
                } catch (e) {}
            }
            
            function getCookie(name) {
                try {
                    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
                    if (match) return decodeURIComponent(match[2]);
                    return null;
                } catch (e) {
                    return null;
                }
            }
            
            function deleteCookie(name) {
                document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            }

            // ============================================================
            // KEY STORAGE - Data that needs to survive clear history
            // ============================================================
            const storageKeys = {
                gateExpiry: 'accessGateExpiry',
                trialData: 'prekgPhonicsTrial',
                systemData: 'prekgPhonicsSystem',
                secureData: 'prekgPhonicsData'
            };

            // ============================================================
            // iOS: Cookie Backup System
            // ============================================================
            if (isIOS) {
                console.log('🍎 iOS: Enabling Cookie Backup for Clear History protection');
                document.getElementById('iosPersistBadge').style.display = 'inline';
                
                // Request persistent storage
                if ('storage' in navigator && 'persist' in navigator.storage) {
                    navigator.storage.persist().then(function(persisted) {
                        console.log('📦 Storage persisted:', persisted);
                    });
                }

                // Save to cookies
                function backupToCookies() {
                    try {
                        const keys = Object.values(storageKeys);
                        for (const key of keys) {
                            const val = localStorage.getItem(key);
                            if (val !== null && val !== undefined) {
                                setCookie('backup_' + key, val, 365);
                            }
                        }
                    } catch (e) {}
                }

                // Restore from cookies
                function restoreFromCookies() {
                    try {
                        let restored = false;
                        const keys = Object.values(storageKeys);
                        for (const key of keys) {
                            const cookieVal = getCookie('backup_' + key);
                            if (cookieVal && !localStorage.getItem(key)) {
                                localStorage.setItem(key, cookieVal);
                                restored = true;
                                console.log('🍪 Restored from cookie:', key);
                            }
                        }
                        return restored;
                    } catch (e) {
                        return false;
                    }
                }

                // Override localStorage for iOS
                const originalSetItem = localStorage.setItem;
                const originalRemoveItem = localStorage.removeItem;
                const originalClear = localStorage.clear;

                localStorage.setItem = function(key, value) {
                    originalSetItem.call(localStorage, key, value);
                    if (Object.values(storageKeys).includes(key)) {
                        setCookie('backup_' + key, value, 365);
                    }
                };

                localStorage.removeItem = function(key) {
                    originalRemoveItem.call(localStorage, key);
                    if (Object.values(storageKeys).includes(key)) {
                        deleteCookie('backup_' + key);
                    }
                };

                localStorage.clear = function() {
                    originalClear.call(localStorage);
                    console.log('🛡️ localStorage cleared but cookies preserved');
                };

                // Restore on load
                const restored = restoreFromCookies();
                if (restored) {
                    console.log('🍪 Data restored from cookies after clear history');
                }

                // Periodic backup
                setInterval(backupToCookies, 60000);
                window.addEventListener('beforeunload', backupToCookies);
                window.addEventListener('pagehide', backupToCookies);
                document.addEventListener('visibilitychange', function() {
                    if (document.hidden) backupToCookies();
                });

                console.log('🍎 iOS: Cookie backup enabled - Data survives Clear History');
            }

            // ============================================================
            // ANDROID / WINDOWS / macOS: Standard localStorage
            // ============================================================
            if (isAndroid) {
                console.log('🤖 Android: Using standard localStorage');
            }
            if (isWindows) {
                console.log('🪟 Windows: Using standard localStorage');
            }
            if (!isIOS && !isAndroid && !isWindows) {
                console.log('🍎 macOS/Other: Using standard localStorage');
            }

            // ============================================================
            // UNIVERSAL: Check and Redirect if Access Valid
            // ============================================================
            function checkAccessAndRedirect() {
                try {
                    // Check gate expiry
                    const gateVal = localStorage.getItem('accessGateExpiry');
                    if (gateVal !== null) {
                        const expiry = parseInt(gateVal, 10);
                        if (expiry > Date.now()) {
                            console.log('✅ Access valid, redirecting to msandmf1.html');
                            window.location.href = 'msandmf1.html';
                            return true;
                        } else {
                            console.log('⏰ Access expired, showing code entry');
                            localStorage.removeItem('accessGateExpiry');
                        }
                    }

                    // Check trial data
                    const trialRaw = localStorage.getItem('prekgPhonicsTrial');
                    if (trialRaw) {
                        try {
                            const trialData = JSON.parse(atob(trialRaw));
                            if (trialData.expires > Date.now()) {
                                console.log('✅ Trial active, redirecting to msandmf1.html');
                                window.location.href = 'msandmf1.html';
                                return true;
                            } else {
                                console.log('⏰ Trial expired');
                                localStorage.removeItem('prekgPhonicsTrial');
                            }
                        } catch (e) {
                            console.log('⚠️ Trial data corrupt');
                            localStorage.removeItem('prekgPhonicsTrial');
                        }
                    }

                    return false;
                } catch (e) {
                    console.log('⚠️ Access check error:', e);
                    return false;
                }
            }

            // Run access check immediately
            const accessValid = checkAccessAndRedirect();

            // If access valid, we won't reach this point (redirected)
            console.log('🔒 No valid access found, showing code entry page');

            // Store platform info for later use
            window.__platform = {
                isIOS: isIOS,
                isAndroid: isAndroid,
                isWindows: isWindows
            };

        })();

        // ============================================================
        // iSPRING COURSE OFFLINE DOWNLOAD MANAGER
        // ============================================================
        class IspringDownloadManager {
            constructor() {
                this.dbName = 'IspringCourseDB';
                this.dbVersion = 1;
                this.db = null;
                
                if (typeof courseFiles !== 'undefined' && courseFiles.length > 0) {
                    this.courseFiles = courseFiles;
                    this.totalSize = courseFiles.reduce((sum, f) => sum + f.size, 0);
                    console.log(`✅ Loaded ${this.courseFiles.length} course files (${(this.totalSize / (1024 * 1024)).toFixed(1)} MB)`);
                    document.getElementById('fileCountBadge').textContent = this.courseFiles.length + ' files';
                } else {
                    console.warn('⚠️ No course files found, using empty list');
                    this.courseFiles = [];
                    this.totalSize = 0;
                }
                
                this.downloadedSize = 0;
                this.isDownloading = false;
                this.isPaused = false;
                this.currentFileIndex = 0;
                this.fileStatus = {};
                this.startTime = null;
                this.autoDownloadStarted = false;
                this.autoDownloadEnabled = true;
                this.isIOS = window.__platform ? window.__platform.isIOS : false;
                
                this.init();
            }

            async init() {
                await this.initIndexedDB();
                await this.loadProgress();
                await this.getFileSizes();
                this.setupEventListeners();
                this.updateUI();
                this.checkOfflineStatus();
                
                document.getElementById('totalSize').textContent = '/ ' + (this.totalSize / (1024 * 1024)).toFixed(1) + ' MB';
                
                // Auto-download only if access is valid
                const gateExpiry = this.getGateExpiry();
                const trialData = this.getTrialData();
                
                if ((gateExpiry !== null && gateExpiry > Date.now()) || 
                    (trialData && trialData.expires > Date.now())) {
                    await this.checkAutoDownload();
                }
            }

            // ============================================================
            // SAFE STORAGE METHODS
            // ============================================================
            getGateExpiry() {
                try {
                    const val = localStorage.getItem('accessGateExpiry');
                    if (val === null) return null;
                    return parseInt(val, 10);
                } catch (e) {
                    return null;
                }
            }

            getTrialData() {
                try {
                    const raw = localStorage.getItem('prekgPhonicsTrial');
                    if (raw) return JSON.parse(atob(raw));
                } catch (_) {}
                return null;
            }

            // ============================================================
            // AUTO-DOWNLOAD (Only runs when access is valid)
            // ============================================================
            async checkAutoDownload() {
                const allDownloaded = await this.isAllDownloaded();
                if (allDownloaded) {
                    console.log('✅ Course already downloaded');
                    return;
                }
                
                console.log('🚀 Access granted - starting auto-download');
                this.startAutoDownload();
            }

            startAutoDownload() {
                if (this.autoDownloadStarted) return;
                if (this.isDownloading) return;
                
                this.autoDownloadStarted = true;
                const badge = document.getElementById('autoDownloadBadge');
                badge.style.display = 'inline';
                badge.textContent = '⏳ Auto';
                badge.className = 'auto-download-badge';
                
                this.startDownload();
                document.getElementById('downloadBtn').textContent = '⏸️ Pause (Auto)';
            }

            // ============================================================
            // DATABASE METHODS
            // ============================================================
            initIndexedDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);
                    
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('files')) {
                            db.createObjectStore('files', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('metadata')) {
                            db.createObjectStore('metadata', { keyPath: 'id' });
                        }
                    };
                    
                    request.onsuccess = (event) => {
                        this.db = event.target.result;
                        resolve();
                    };
                    
                    request.onerror = (event) => {
                        reject(event.target.error);
                    };
                });
            }

            async getFileSizes() {
                if (this.courseFiles.length > 0 && this.courseFiles[0].size > 0) {
                    return;
                }
                
                for (let i = 0; i < this.courseFiles.length; i++) {
                    const file = this.courseFiles[i];
                    try {
                        const response = await fetch(file.path, { method: 'HEAD' });
                        const size = response.headers.get('content-length');
                        if (size) {
                            file.size = parseInt(size);
                            this.totalSize += file.size;
                        }
                    } catch (e) {
                        file.size = 1024 * 1024;
                        this.totalSize += file.size;
                    }
                }
                document.getElementById('totalSize').textContent = '/ ' + (this.totalSize / (1024 * 1024)).toFixed(1) + ' MB';
            }

            async loadProgress() {
                try {
                    const metadata = await this.getMetadata('downloadProgress');
                    if (metadata) {
                        this.downloadedSize = metadata.downloadedSize || 0;
                        this.currentFileIndex = metadata.currentFileIndex || 0;
                        this.fileStatus = metadata.fileStatus || {};
                        this.autoDownloadStarted = metadata.autoDownloadStarted || false;
                    }
                    
                    const files = await this.getAllFiles();
                    let total = 0;
                    for (const file of files) {
                        total += file.size || 0;
                        this.fileStatus[file.id] = { status: 'done' };
                    }
                    if (total > 0) {
                        this.downloadedSize = total;
                    }
                } catch (e) {
                    console.log('Load progress error:', e);
                }
            }

            async getMetadata(id) {
                return new Promise((resolve, reject) => {
                    if (!this.db) {
                        resolve(null);
                        return;
                    }
                    const transaction = this.db.transaction(['metadata'], 'readonly');
                    const store = transaction.objectStore('metadata');
                    const request = store.get(id);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => resolve(null);
                });
            }

            async saveMetadata(id, data) {
                return new Promise((resolve, reject) => {
                    if (!this.db) {
                        resolve();
                        return;
                    }
                    const transaction = this.db.transaction(['metadata'], 'readwrite');
                    const store = transaction.objectStore('metadata');
                    const request = store.put({ ...data, id });
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            async getAllFiles() {
                return new Promise((resolve, reject) => {
                    if (!this.db) {
                        resolve([]);
                        return;
                    }
                    const transaction = this.db.transaction(['files'], 'readonly');
                    const store = transaction.objectStore('files');
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async saveFile(id, data, size) {
                return new Promise((resolve, reject) => {
                    if (!this.db) {
                        reject('Database not initialized');
                        return;
                    }
                    const transaction = this.db.transaction(['files'], 'readwrite');
                    const store = transaction.objectStore('files');
                    const request = store.put({ id, data, size, timestamp: Date.now() });
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            async getFile(id) {
                return new Promise((resolve, reject) => {
                    if (!this.db) {
                        resolve(null);
                        return;
                    }
                    const transaction = this.db.transaction(['files'], 'readonly');
                    const store = transaction.objectStore('files');
                    const request = store.get(id);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            // ============================================================
            // DOWNLOAD METHODS
            // ============================================================
            setupEventListeners() {
                window.addEventListener('online', () => {
                    document.getElementById('offlineBadge').classList.remove('show');
                    if (this.autoDownloadEnabled && this.isPaused && this.downloadedSize < this.totalSize) {
                        this.resumeDownload();
                    }
                });
                
                window.addEventListener('offline', () => {
                    document.getElementById('offlineBadge').classList.add('show');
                    this.pauseDownload();
                });
                
                document.getElementById('downloadBtn').addEventListener('click', () => {
                    this.toggleDownload();
                });
                
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden && this.isDownloading) {
                        this.pauseDownload();
                    }
                });
            }

            async toggleDownload() {
                if (this.isDownloading) {
                    this.pauseDownload();
                } else {
                    const allDownloaded = await this.isAllDownloaded();
                    if (allDownloaded) {
                        this.showMessage('✅ Course already downloaded! Ready for offline use.', 'success');
                        return;
                    }
                    this.autoDownloadEnabled = false;
                    document.getElementById('autoDownloadBadge').style.display = 'none';
                    this.startDownload();
                }
            }

            async isAllDownloaded() {
                const files = await this.getAllFiles();
                return files.length >= this.courseFiles.length;
            }

            async startDownload() {
                if (this.isDownloading) return;
                
                if (this.courseFiles.length === 0) {
                    this.showMessage('⚠️ No course files found. Please check course_files.js', 'error');
                    return;
                }
                
                const storageEstimate = await this.getStorageEstimate();
                if (storageEstimate && storageEstimate.quota - storageEstimate.usage < this.totalSize) {
                    this.showMessage('⚠️ Not enough storage space. Please free up space.', 'error');
                    return;
                }
                
                this.isDownloading = true;
                this.isPaused = false;
                this.startTime = Date.now();
                
                if (this.autoDownloadEnabled && this.autoDownloadStarted) {
                    document.getElementById('downloadBtn').textContent = '⏸️ Pause (Auto)';
                } else {
                    document.getElementById('downloadBtn').textContent = '⏸️ Pause';
                }
                
                document.getElementById('downloadStatus').textContent = '⏳ Downloading...';
                document.getElementById('downloadStatus').className = 'download-status downloading';
                
                await this.downloadFiles();
            }

            pauseDownload() {
                this.isPaused = true;
                this.isDownloading = false;
                
                if (this.autoDownloadEnabled && this.autoDownloadStarted) {
                    document.getElementById('downloadBtn').textContent = '▶️ Resume (Auto)';
                } else {
                    document.getElementById('downloadBtn').textContent = '▶️ Resume';
                }
                
                document.getElementById('downloadStatus').textContent = '⏸️ Paused';
                document.getElementById('downloadStatus').className = 'download-status paused';
                this.saveProgress();
            }

            async resumeDownload() {
                const allDownloaded = await this.isAllDownloaded();
                if (allDownloaded) {
                    this.showMessage('✅ Download complete!', 'success');
                    return;
                }
                
                this.isPaused = false;
                this.isDownloading = true;
                
                if (this.autoDownloadEnabled && this.autoDownloadStarted) {
                    document.getElementById('downloadBtn').textContent = '⏸️ Pause (Auto)';
                } else {
                    document.getElementById('downloadBtn').textContent = '⏸️ Pause';
                }
                
                document.getElementById('downloadStatus').textContent = '⏳ Downloading...';
                document.getElementById('downloadStatus').className = 'download-status downloading';
                
                await this.downloadFiles();
            }

            async downloadFiles() {
                for (let i = this.currentFileIndex; i < this.courseFiles.length && !this.isPaused; i++) {
                    const file = this.courseFiles[i];
                    
                    const existing = await this.getFile(file.id);
                    if (existing) {
                        this.fileStatus[file.id] = { status: 'done' };
                        this.downloadedSize += existing.size || 0;
                        this.currentFileIndex = i + 1;
                        this.updateUI();
                        continue;
                    }
                    
                    try {
                        this.fileStatus[file.id] = { status: 'downloading' };
                        
                        const response = await fetch(file.path);
                        if (!response.ok) {
                            throw new Error('Failed to fetch: ' + response.status);
                        }
                        
                        const data = await response.arrayBuffer();
                        const size = data.byteLength;
                        
                        await this.saveFile(file.id, data, size);
                        
                        this.downloadedSize += size;
                        this.fileStatus[file.id] = { status: 'done' };
                        this.currentFileIndex = i + 1;
                        
                        this.updateUI();
                        
                        if (i % 3 === 0) {
                            await this.saveProgress();
                        }
                        
                    } catch (error) {
                        console.error('Download error for', file.id, error);
                        this.fileStatus[file.id] = { status: 'error', error: error.message };
                        this.showMessage('⚠️ Error downloading file', 'error');
                        
                        let retries = 0;
                        while (retries < 3 && !this.isPaused) {
                            await new Promise(resolve => setTimeout(resolve, 2000));
                            try {
                                const response = await fetch(file.path);
                                if (response.ok) {
                                    const data = await response.arrayBuffer();
                                    const size = data.byteLength;
                                    await this.saveFile(file.id, data, size);
                                    this.downloadedSize += size;
                                    this.fileStatus[file.id] = { status: 'done' };
                                    this.currentFileIndex = i + 1;
                                    this.updateUI();
                                    break;
                                }
                            } catch (e) {
                                retries++;
                            }
                        }
                        
                        if (this.fileStatus[file.id].status !== 'done') {
                            if (this.autoDownloadEnabled) {
                                console.warn('Auto-download: Error on ' + file.id + ', continuing...');
                                continue;
                            } else {
                                this.pauseDownload();
                                return;
                            }
                        }
                    }
                }
                
                const allDownloaded = await this.isAllDownloaded();
                if (allDownloaded) {
                    this.isDownloading = false;
                    document.getElementById('downloadBtn').textContent = '✅ Complete';
                    document.getElementById('downloadBtn').disabled = true;
                    document.getElementById('downloadStatus').textContent = '✅ Ready Offline';
                    document.getElementById('downloadStatus').className = 'download-status done';
                    
                    document.getElementById('autoDownloadBadge').style.display = 'none';
                    
                    this.showMessage('🎉 Course downloaded! You can now use offline.', 'success');
                    await this.saveProgress();
                    await this.cacheForOffline();
                    
                    // Redirect to msandmf1.html after download
                    console.log('✅ Download complete, redirecting to msandmf1.html');
                    setTimeout(() => {
                        window.location.href = 'msandmf1.html';
                    }, 1000);
                }
            }

            async cacheForOffline() {
                try {
                    const cache = await caches.open('ispring-course-v1');
                    const files = await this.getAllFiles();
                    for (const file of files) {
                        const response = new Response(file.data, {
                            headers: { 'Content-Type': this.getContentType(file.id) }
                        });
                        await cache.put('/' + file.id, response);
                    }
                    document.getElementById('cacheInfo').textContent = '✅ All files cached for offline use';
                } catch (e) {
                    console.log('Cache error:', e);
                }
            }

            getContentType(filename) {
                const ext = filename.split('.').pop().toLowerCase();
                const types = {
                    'html': 'text/html', 'css': 'text/css', 'js': 'application/javascript',
                    'json': 'application/json', 'png': 'image/png', 'jpg': 'image/jpeg',
                    'jpeg': 'image/jpeg', 'gif': 'image/gif', 'svg': 'image/svg+xml',
                    'mp3': 'audio/mpeg', 'mp4': 'video/mp4', 'webm': 'video/webm',
                    'pdf': 'application/pdf', 'xml': 'application/xml',
                    'cur': 'image/x-win-bitmap', 'ico': 'image/x-icon',
                    'woff': 'font/woff', 'woff2': 'font/woff2', 'ttf': 'font/ttf',
                    'eot': 'application/vnd.ms-fontobject', 'otf': 'font/otf'
                };
                return types[ext] || 'application/octet-stream';
            }

            async saveProgress() {
                try {
                    await this.saveMetadata('downloadProgress', {
                        downloadedSize: this.downloadedSize,
                        currentFileIndex: this.currentFileIndex,
                        fileStatus: this.fileStatus,
                        autoDownloadStarted: this.autoDownloadStarted,
                        lastUpdated: Date.now()
                    });
                } catch (e) {
                    console.log('Save progress error:', e);
                }
            }

            updateUI() {
                const progress = this.totalSize > 0 ? Math.min((this.downloadedSize / this.totalSize) * 100, 100) : 0;
                document.getElementById('progressFill').style.width = progress + '%';
                document.getElementById('downloadedSize').textContent = 
                    (this.downloadedSize / (1024 * 1024)).toFixed(1) + ' MB';
                
                if (this.startTime && this.downloadedSize > 0) {
                    const elapsed = (Date.now() - this.startTime) / 1000;
                    if (elapsed > 0) {
                        const speed = this.downloadedSize / elapsed / (1024 * 1024);
                        document.getElementById('downloadSpeed').textContent = speed.toFixed(1) + ' MB/s';
                    }
                }
            }

            // File list update - DISABLED (no file names shown)
            updateFileList() {
                // Intentionally empty - file list is hidden on all platforms
            }

            async checkOfflineStatus() {
                const allDownloaded = await this.isAllDownloaded();
                if (allDownloaded) {
                    document.getElementById('downloadStatus').textContent = '✅ Ready Offline';
                    document.getElementById('downloadStatus').className = 'download-status done';
                    document.getElementById('downloadBtn').textContent = '✅ Complete';
                    document.getElementById('downloadBtn').disabled = true;
                    document.getElementById('cacheInfo').textContent = '✅ Course ready for offline use';
                    document.getElementById('autoDownloadBadge').style.display = 'none';
                } else {
                    const files = await this.getAllFiles();
                    if (files.length > 0) {
                        document.getElementById('downloadStatus').textContent = '⏳ Partial Download';
                        document.getElementById('downloadStatus').className = 'download-status paused';
                    }
                }
            }

            async getStorageEstimate() {
                if ('storage' in navigator && 'estimate' in navigator.storage) {
                    try {
                        return await navigator.storage.estimate();
                    } catch (e) {
                        return null;
                    }
                }
                return null;
            }

            showMessage(text, type) {
                const msg = document.getElementById('message');
                msg.className = type;
                msg.textContent = text;
                setTimeout(() => { if (msg.className === type) msg.textContent = ''; }, 8000);
            }
        }

        // ============================================================
        // MAIN APPLICATION
        // ============================================================
        (function() {
            const scriptUrl = 'https://script.google.com/macros/s/AKfycbw1BXgX4wy4nPZgSaJWFdBcV88OVliqn1pdQ88Xdwiz1x7MLp0lrYEyskJ1f5bnZdq-/exec';
            const storageKey = 'prekgPhonicsData';
            const trialKey = 'prekgPhonicsTrial';
            const systemKey = 'prekgPhonicsSystem';
            const gateExpiryKey = 'accessGateExpiry';

            const secretInput = document.getElementById('secretCode');
            const activateBtn = document.getElementById('activateBtn');
            const trialBtn = document.getElementById('trialBtn');
            const buyBtn = document.getElementById('buyBtn');
            const messageEl = document.getElementById('message');
            const timerDisplay = document.getElementById('timerDisplay');
            const trialStatus = document.getElementById('trialStatus');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const closeBtn = document.getElementById('closeButton');

            const downloadManager = new IspringDownloadManager();

            function showLoading() {
                loadingOverlay.classList.add('active');
            }
            function hideLoading() {
                loadingOverlay.classList.remove('active');
            }

            function showError(text) {
                messageEl.className = 'error';
                messageEl.textContent = text;
                setTimeout(() => { if (messageEl.className === 'error') messageEl.textContent = ''; }, 10000);
            }
            function showSuccess(text) {
                messageEl.className = 'success';
                messageEl.textContent = text;
            }
            function showInfo(text) {
                messageEl.className = 'info';
                messageEl.textContent = text;
                setTimeout(() => { if (messageEl.className === 'info') messageEl.textContent = ''; }, 8000);
            }

            function getSystemTime() {
                const now = Date.now();
                let systemData = null;
                try {
                    const raw = localStorage.getItem(systemKey);
                    if (raw) systemData = JSON.parse(atob(raw));
                } catch (_) {}

                if (systemData) {
                    if (systemData.lastCheck > now) {
                        return { valid: false, reason: 'backdate_detected' };
                    }
                    const diff = now - systemData.lastCheck;
                    if (diff > 24 * 60 * 60 * 1000) {
                        saveSystemData(now);
                    }
                } else {
                    saveSystemData(now);
                }
                return { valid: true, timestamp: now };
            }

            function saveSystemData(ts) {
                try {
                    const data = JSON.stringify({ lastCheck: ts, installDate: ts });
                    localStorage.setItem(systemKey, btoa(data));
                } catch (_) {}
            }

            function getTrialData() {
                try {
                    const raw = localStorage.getItem(trialKey);
                    if (raw) return JSON.parse(atob(raw));
                } catch (_) {}
                return null;
            }

            function isTrialValid(trialData) {
                if (!trialData) return false;
                const sys = getSystemTime();
                if (!sys.valid) return false;
                return trialData.expires > sys.timestamp;
            }

            function getGateExpiry() {
                const val = localStorage.getItem(gateExpiryKey);
                if (val === null) return null;
                return parseInt(val, 10);
            }
            function setGateExpiry(ts) {
                localStorage.setItem(gateExpiryKey, ts.toString());
            }

            function redirectToForm() {
                const formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSd8GAR5JemcRwfpqgefJa2T7AE2CJ93R2M61Xlp30N_YHiuVQ/viewform';
                window.open(formUrl, '_blank');
                showInfo('📋 Please fill out the form to request your free trial code.');
            }

            async function fetchCodes() {
                try {
                    const resp = await fetch(scriptUrl + '?action=fetchCodes&_=' + Date.now());
                    return await resp.json();
                } catch (e) {
                    console.error('fetchCodes error:', e);
                    showError('Unable to fetch codes. Please check your connection.');
                    return [];
                }
            }

            async function logCodeUsage(code) {
                try {
                    await fetch(scriptUrl + '?action=logCode&code=' + code + '&deviceInfo=' + encodeURIComponent(navigator.userAgent));
                } catch (_) {}
            }

            async function handleSubmit() {
                const code = secretInput.value.trim().toUpperCase();
                if (code.length !== 6) {
                    showError('Code must be exactly 6 characters!');
                    return;
                }

                showLoading();
                try {
                    const codes = await fetchCodes();
                    let matchedCode = null;
                    for (let i = 0; i < codes.length; i++) {
                        if (codes[i].code === code) {
                            matchedCode = codes[i];
                            break;
                        }
                    }

                    if (!matchedCode) {
                        hideLoading();
                        showError('❌ Invalid or expired code. Please try again.');
                        return;
                    }

                    await logCodeUsage(code);

                    let expires = Date.now() + Number(matchedCode.duration);
                    const currentGate = getGateExpiry();
                    if (currentGate !== null && currentGate > Date.now()) {
                        expires = currentGate + Number(matchedCode.duration);
                    }
                    setGateExpiry(expires);

                    const data = JSON.stringify({ code: matchedCode.code, expires, url: matchedCode.url });
                    localStorage.setItem(storageKey, btoa(data));

                    hideLoading();
                    showSuccess('✅ Access granted! Redirecting...');
                    
                    // Redirect to msandmf1.html
                    setTimeout(() => {
                        window.location.href = matchedCode.url;
                    }, 1000);

                } catch (err) {
                    hideLoading();
                    showError('⚠️ Network error. Please try again.');
                    console.error('Submit error:', err);
                }
            }

            async function openBuyLink() {
                showLoading();
                try {
                    const resp = await fetch(scriptUrl + '?action=getBuyLink&_=' + Date.now());
                    const data = await resp.json();
                    hideLoading();
                    if (data.buyLink) {
                        window.open(data.buyLink, '_blank');
                    } else {
                        showError(data.error || 'Buy link not found.');
                    }
                } catch (err) {
                    hideLoading();
                    console.error('Buy link error:', err);
                    showError('Unable to fetch buy link.');
                }
            }

            function showRemainingTrial() {
                const trialData = getTrialData();
                const gateExpiry = getGateExpiry();

                if (gateExpiry !== null && gateExpiry > Date.now()) {
                    const remainingMs = gateExpiry - Date.now();
                    const hours = Math.floor(remainingMs / (1000 * 60 * 60));
                    const days = Math.floor(remainingMs / (1000 * 60 * 60 * 24));
                    let txt = '';
                    if (days > 0) txt = '📅 ' + days + ' day(s) remaining';
                    else if (hours > 0) txt = '⏰ ' + hours + ' hour(s) remaining';
                    else {
                        const mins = Math.floor(remainingMs / (1000 * 60));
                        txt = mins > 0 ? '⏳ ' + mins + ' minute(s) remaining' : '⏳ Less than a minute remaining';
                    }
                    timerDisplay.textContent = txt;
                    timerDisplay.style.color = '#1c2e4a';
                } else if (trialData && trialData.expires <= Date.now()) {
                    timerDisplay.textContent = '⏰ Your free trial has expired';
                    timerDisplay.style.color = '#ff3b30';
                } else {
                    timerDisplay.textContent = '📝 Request your free trial code via the form!';
                    timerDisplay.style.color = '#5b6f87';
                }
            }

            function init() {
                const sys = getSystemTime();
                if (!sys.valid && sys.reason === 'backdate_detected') {
                    showError('⚠️ System time tampering detected!');
                    trialBtn.disabled = true;
                    trialBtn.textContent = '🚫 Access Denied';
                    trialBtn.style.opacity = '0.4';
                    secretInput.disabled = true;
                    activateBtn.disabled = true;
                    return;
                }

                // Check if already redirected (shouldn't happen since we check at top)
                // But keep as safety net
                const gateExpiry = getGateExpiry();
                if (gateExpiry !== null && gateExpiry > Date.now()) {
                    window.location.href = 'msandmf1.html';
                    return;
                }

                const trialData = getTrialData();
                if (trialData) {
                    if (isTrialValid(trialData)) {
                        window.location.href = 'msandmf1.html';
                        return;
                    } else {
                        localStorage.removeItem(trialKey);
                        const sys2 = getSystemTime();
                        if (!sys2.valid) {
                            showError('⚠️ System time tampering detected!');
                        } else {
                            showTrialUsed('⏰ Your 3-day free trial has expired.');
                        }
                        trialBtn.disabled = false;
                        trialBtn.textContent = '📝 Get 3 Days Free Trial Code';
                    }
                } else {
                    trialBtn.disabled = false;
                    trialBtn.textContent = '📝 Get 3 Days Free Trial Code';
                }

                showRemainingTrial();
            }

            function showTrialUsed(msg) {
                trialStatus.style.display = 'block';
                trialStatus.textContent = msg;
                trialStatus.style.color = '#c0392b';
            }

            activateBtn.addEventListener('click', handleSubmit);
            trialBtn.addEventListener('click', redirectToForm);
            buyBtn.addEventListener('click', openBuyLink);

            secretInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSubmit();
            });

            closeBtn.addEventListener('click', () => {
                if (window.opener && !window.opener.closed) {
                    window.close();
                } else {
                    window.history.length > 1 ? window.history.back() : window.close();
                }
            });

            setInterval(() => {
                const sys = getSystemTime();
                if (!sys.valid && sys.reason === 'backdate_detected') {
                    showError('⚠️ System time tampering detected!');
                    trialBtn.disabled = true;
                    trialBtn.textContent = '🚫 Access Denied';
                    trialBtn.style.opacity = '0.3';
                    activateBtn.disabled = true;
                    secretInput.disabled = true;
                }
            }, 30000);

            setInterval(showRemainingTrial, 60000);

            init();
        })();
    </script>

        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'ispring-course-v1';
                const urlsToCache = [
                    '.', 'index.html', 'msandmf1.html', 'course_files.js',
                    'manifest.json', 'offline.html',
                    'icons/icon-72.png', 'icons/icon-96.png', 'icons/icon-128.png',
                    'icons/icon-144.png', 'icons/icon-152.png', 'icons/icon-192.png',
                    'icons/icon-256.png', 'icons/icon-384.png', 'icons/icon-512.png'
                ];

                self.addEventListener('install', function(event) {
                    event.waitUntil(
                        caches.open(CACHE_NAME)
                            .then(function(cache) { return cache.addAll(urlsToCache); })
                    );
                });

                self.addEventListener('activate', function(event) {
                    event.waitUntil(
                        caches.keys().then(function(keyList) {
                            return Promise.all(keyList.map(function(key) {
                                if (key !== CACHE_NAME) { return caches.delete(key); }
                            }));
                        })
                    );
                });

                self.addEventListener('fetch', function(event) {
                    event.respondWith(
                        caches.match(event.request)
                            .then(function(response) {
                                if (response) { return response; }
                                return fetch(event.request).then(function(response) {
                                    if (!response || response.status !== 200) { return response; }
                                    var responseToCache = response.clone();
                                    caches.open(CACHE_NAME)
                                        .then(function(cache) { cache.put(event.request, responseToCache); });
                                    return response;
                                });
                            })
                    );
                });
            `;

            try {
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl, { scope: '/' })
                    .catch(() => {});
            } catch (e) {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            }
        }
    </script>
